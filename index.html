<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Wanderlust's Home</title>

  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.1/css/all.min.css" integrity="sha512-5Hs3dF2AEPkpNAR7UiOHba+lRSJNeM2ECkwxUIxC1Q/FLycGTbNapWXB4tP889k5T5Ju8fs4b1P5z/iB4nMfSQ==" crossorigin="anonymous" referrerpolicy="no-referrer" />
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body, html {
      height: 100%;
      font-family: Arial, sans-serif;
    }

    .navbar {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 80px;
      background-color:black;
      color: white;
      padding: 10px 20px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      z-index: 100;
    }
    .logo {
    background-image: url("logo1.png");
    background-size: cover;
    height:80px;
    width:120px;
    }

    .navbar .menu {
      display: flex;
      flex-grow: 1;
      justify-content: center;
      gap: 40px;
    }

    .navbar .menu a {
      color: white;
      text-decoration: none;
      font-size: 1rem;
      transition: color 0.3s;
    }

    .navbar .menu a:hover {
      color:coral;
    }

    .navbar .search {
      position: relative;
      margin-right: 20px;
    }

    .navbar .search input {
      padding: 5px 10px;
      font-size: 1rem;
      border: 1px solid #ccc;
      border-radius: 5px;
      outline: none;
    }

    .navbar .search button {
      position: absolute;
      top: 50%;
      right: 5px;
      transform: translateY(-50%);
      background: none;
      border: none;
      color: #1e2a37;
      font-size: 1.2rem;
      cursor: pointer;
    }

    .navbar .user {
      position: relative;
      cursor: pointer;
    }

    .navbar .user-icon {
      font-size: 1.5rem;
      color: white;
    }

    .login-form {
      position: absolute;
      top: 50px;
      right: 0;
      background-color: white;
      color: black;
      border: 1px solid #ccc;
      border-radius: 5px;
      padding: 20px;
      width: 250px;
      display: none;
      z-index: 200;
    }

    .login-form input {
      width: 100%;
      margin-bottom: 10px;
      padding: 8px;
      border: 1px solid #ccc;
      border-radius: 5px;
      font-size: 1rem;
    }

    .login-form button {
      width: 100%;
      padding: 10px;
      background-color:coral;
      color: white;
      border: none;
      border-radius: 5px;
      cursor: pointer;
      font-size: 1rem;
    }

    .login-form button:hover {
      background-color: grey;
    }

    .background {
      position: relative;
      width: 100%;
      height: 100%;
      overflow: hidden;
    }

    .background .fallback {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: url('demoimg1.jpg') center center/cover no-repeat;
      z-index: -2;
    }

    .overlay {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background-color: rgba(0, 0, 0, 0.4);
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      color: white;
      text-align: center;
      padding: 20px;
    }

    .overlay h1 {
      font-size: 3.5rem;
      font-weight: bold;
      margin-bottom: 1rem;
    }
    .overlay h1:hover{
        background-color: grey;
    }

    .overlay p {
      font-size: 3rem;
      font-weight: bold;
      margin-bottom: 2rem;
    }
    .overlay p:hover{
        background-color: grey;
    }

    .overlay button {
      padding: 10px 30px;
      font-size: 1.2rem;
      font-weight: bold;
      color: white;
      background-color: coral;
      border: none;
      border-radius: 5px;
      cursor: pointer;
      transition: background-color 0.3s;
    }

    .overlay button:hover {
      background-color: grey;
    }
  </style>
  <script>
    function toggleLoginForm() {
      const loginForm = document.querySelector('.login-form');
      loginForm.style.display = loginForm.style.display === 'block' ? 'none' : 'block';
    }
  </script>
</head>
<body>

  <div class="navbar">
    <div class="logo"></div>
    <div class="menu">
      <a href="home.html"s>Home</a>
      <a href="packages.html" target="_blank">Packages</a>
      <a href="bookings.html" target="_blank">Bookings</a>
      <a href="contact.html" target="_blank">Contact</a>
    </div>
    <div class="search">
      <input type="text" placeholder="Search...">
      <button>&#128269;</button>
    </div>
    <div class="user" onclick="toggleLoginForm()">
      <span class="user-icon">&#128100;</span>
      <div class="login-form">
        <h3>Login</h3>
        <input type="text" placeholder="Username">
        <input type="password" placeholder="Password">
        <button>Login</button>
      </div>
    </div>
  </div>

  <div class="background">
    
    
    <div class="fallback"></div>

    
    <div class="overlay">
      <h1>Embark on unforgettable adventures with us!</h1>
      <p>Wanderlust's - Where dreams take flight!</p>
      <button>Discover more</button>
    </div>
  </div>

</body>
</html>
