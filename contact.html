<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Contact Us!</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body, html {
      font-family: Arial, sans-serif;
      height: 100%;
      background : url("contactusBG.jpg");
    }

    header {
      background-color: black;
      color: white;
      width: 100%;
      height: 80px;
      text-align: center;
      justify-content: center;
      display: flex;
      font-size: 2rem;
      padding: 10px 20px;
      justify-content: space-between;
    }

    header h1 {
        justify-content: center;
        font-size: 2rem;
        padding: 10px 20px;
        display: flex;
        
        text-align: center;
    }

    .container {
      display: flex;
      justify-content: center;
      align-items: flex-start;
      padding: 40px 20px;
      gap: 50px;
      flex-wrap: wrap;
    }
    .logo {
    background-image: url("logo1.png");
    background-size: cover;
    height:80px;
    width:120px;
    }


    .contact-form, .contact-details {
      background-color: black;
      padding: 20px;
      border-radius: 10px;
      box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
      width: 100%;
      max-width: 500px;
      color:antiquewhite
    }

    .contact-form h2, .contact-details h2 {
      text-align: center;
      margin-bottom: 20px;
      color:whitesmoke;
    }

    .form-group {
      margin-bottom: 15px;
    }

    .form-group label {
      font-weight: bold;
      margin-bottom: 5px;
    }

    .form-group input, .form-group textarea {
      width: 100%;
      padding: 10px;
      font-size: 1rem;
      border: 1px solid #ccc;
      border-radius: 5px;
    }

    .form-group textarea {
      resize: vertical;
      height: 150px;
    }

    .form-group button {
      background-color: coral;
      color: whitesmoke;
      padding: 10px;
      border: none;
      width: 100%;
      font-size: 1.1rem;
      border-radius: 5px;
      cursor: pointer;
    }

    .form-group button:hover {
      background-color: grey;
    }

    .contact-details {
      max-width: 400px;
    }

    .contact-details ul {
      list-style: none;
      padding-left: 0;
    }

    .contact-details li {
      margin-bottom: 15px;
      font-size: 1rem;
    }

    .contact-details li i {
      margin-right: 10px;
      color: #007BFF;
    }

    /* Social Media Icons */
    .social-media {
      display: flex;
      justify-content: center;
      gap: 20px;
      margin-top: 20px;
    }

    .social-media a {
      font-size: 1.5rem;
      color: #007BFF;
      text-decoration: none;
    }

    .social-media a:hover {
      color: #0056b3;
    }

    

    
    

  </style>
</head>
<body>

  <header>
    <div class="logo"></div>
    <h1>Contact Us</h1>
  </header>

  <div class="container">

    <!-- Contact Form -->
    <div class="contact-form">
      <h2>Join Us Now</h2>
      <form action="#" method="POST">
        <div class="form-group">
          <label for="name">Your Name</label>
          <input type="text" id="name" name="name" placeholder="Enter your name" required>
        </div>
        <div class="form-group">
          <label for="email">Your Email</label>
          <input type="email" id="email" name="email" placeholder="Enter your email" required>
        </div>
        <div class="form-group">
          <label for="message">Your Message</label>
          <textarea id="message" name="message" placeholder="Write your message" required></textarea>
        </div>
        <div class="form-group">
          <button type="submit">Send Message</button>
        </div>
      </form>
    </div>

    <!-- Contact Details -->
    <div class="contact-details">
      <h2>Our Contact Details</h2>
      <ul>
        <li><i class="fas fa-phone-alt"></i>Phone: +91 8076525306 </li>
        <li><i class="fas fa-envelope"></i>Email: Wanderlust@travel.com</li>
        <li><i class="fas fa-map-marker-alt"></i>Address: 123 Parle Street, Mumbai-India  </li>
      </ul>
      <div class="social-media">
        <a href="https://facebook.com" target="_blank">Facebook</a>
        <a href="https://twitter.com" target="_blank">Twitter</a>
        <a href="https://instagram.com" target="_blank">Instagram</a>
      </div>
    </div>

  </div>

  

</body>
</html>
